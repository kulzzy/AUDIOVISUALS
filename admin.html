<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Audiovisuals Admin</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#06152f;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}

.header{
    text-align:center;
    padding:20px 10px;
    border-bottom:2px solid #d4af37;
    margin-bottom:20px;
}

.header h1{
    color:#ffd700;
    font-size:25px;
}

.header p{
    margin-top:6px;
    color:#ccc;
}

.panel{
    background:#0b2247;
    border:1px solid rgba(255,215,0,.3);
    border-radius:12px;
    padding:20px;
    margin-bottom:18px;
}

.panel h2{
    color:#ffd700;
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:15px;
    border:none;
    border-radius:7px;
    font-size:15px;
}

button{
    border:none;
    border-radius:7px;
    padding:12px 18px;
    font-weight:900;
    cursor:pointer;
}

.login-button,
.upload-button{
    background:#ffd700;
    color:#06152f;
}

.logout-button{
    background:#b00020;
    color:#fff;
}

.delete-button{
    background:#d00000;
    color:#fff;
}

button:disabled{
    opacity:.5;
}

.status{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#07172f;
    border-radius:7px;
    color:#fff;
}

.status.show{
    display:block;
}

.progress{
    display:none;
    width:100%;
    height:12px;
    margin-top:15px;
    background:#020914;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#ffd700;
}

.admin-area{
    display:none;
}

.admin-area.active{
    display:block;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.video-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:#071a38;
    border:1px solid rgba(255,255,255,.1);
    border-radius:8px;
    padding:12px;
}

.video-thumb{
    width:120px;
    aspect-ratio:16/9;
    background:#000;
    border-radius:6px;
    overflow:hidden;
    flex-shrink:0;
}

.video-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.video-details{
    flex:1;
    min-width:0;
}

.video-name{
    font-weight:bold;
    word-break:break-word;
}

.video-date{
    margin-top:5px;
    font-size:12px;
    color:#aaa;
}

.hidden{
    display:none!important;
}

@media(max-width:600px){

    .container{
        padding:10px;
    }

    .panel{
        padding:15px;
    }

    .video-item{
        flex-wrap:wrap;
    }

    .video-details{
        width:calc(100% - 132px);
    }

    .delete-button{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

<header class="header">

    <h1>
        KULZZY RADIO AUDIOVISUALS ADMIN
    </h1>

    <p>
        Upload and publish audiovisuals
    </p>

</header>


<!-- LOGIN -->

<div
    id="loginPanel"
    class="panel">

    <h2>
        ADMIN LOGIN
    </h2>

    <label>
        Email
    </label>

    <input
        id="email"
        type="email"
        placeholder="Admin email">


    <label>
        Password
    </label>

    <input
        id="password"
        type="password"
        placeholder="Admin password">


    <button
        id="loginButton"
        class="login-button">

        LOGIN

    </button>


    <div
        id="loginStatus"
        class="status">
    </div>

</div>


<!-- ADMIN -->

<div
    id="adminArea"
    class="admin-area">


    <!-- UPLOAD -->

    <div class="panel">

        <h2>
            UPLOAD AUDIOVISUAL
        </h2>


        <label>
            Video Title
        </label>

        <input
            id="videoTitle"
            type="text"
            placeholder="Enter video title">


        <label>
            Select Video
        </label>

        <input
            id="videoFile"
            type="file"
            accept="video/*">


        <button
            id="uploadButton"
            class="upload-button">

            UPLOAD & PUBLISH

        </button>


        <div
            id="uploadStatus"
            class="status">
        </div>


        <div
            id="progress"
            class="progress">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>

    </div>


    <!-- VIDEO LIST -->

    <div class="panel">

        <h2>
            PUBLISHED VIDEOS
        </h2>

        <div
            id="videoList"
            class="video-list">

            Loading...

        </div>

    </div>


    <!-- LOGOUT -->

    <div class="panel">

        <button
            id="logoutButton"
            class="logout-button">

            LOGOUT

        </button>

    </div>

</div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    remove,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyCheGUZWbyh3IS4l_MbToCyBgYDre8ZU_M",

    authDomain:
    "audiovisuals-500cf.firebaseapp.com",

    databaseURL:
    "https://audiovisuals-500cf-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "audiovisuals-500cf",

    storageBucket:
    "audiovisuals-500cf.firebasestorage.app",

    messagingSenderId:
    "34375747661",

    appId:
    "1:34375747661:web:94ec087328dc5daebd3404",

    measurementId:
    "G-HE48JBFLD6"

};


/* INITIALIZE */

const app =
    initializeApp(firebaseConfig);

const database =
    getDatabase(app);

const auth =
    getAuth(app);


/* ELEMENTS */

const loginPanel =
    document.getElementById("loginPanel");

const adminArea =
    document.getElementById("adminArea");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const loginStatus =
    document.getElementById("loginStatus");

const logoutButton =
    document.getElementById("logoutButton");

const videoTitle =
    document.getElementById("videoTitle");

const videoFile =
    document.getElementById("videoFile");

const uploadButton =
    document.getElementById("uploadButton");

const uploadStatus =
    document.getElementById("uploadStatus");

const progress =
    document.getElementById("progress");

const progressBar =
    document.getElementById("progressBar");

const videoList =
    document.getElementById("videoList");


/* STATUS */

function showStatus(
    element,
    message
){

    element.textContent =
        message;

    element.classList.add(
        "show"
    );

}


/* AUTH STATE */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            loginPanel.classList.add(
                "hidden"
            );

            adminArea.classList.add(
                "active"
            );

            loadVideos();

        }else{

            loginPanel.classList.remove(
                "hidden"
            );

            adminArea.classList.remove(
                "active"
            );

        }

    }
);


/* LOGIN */

loginButton.addEventListener(
    "click",
    async function(){

        const userEmail =
            email.value.trim();

        const userPassword =
            password.value;


        if(
            !userEmail ||
            !userPassword
        ){

            showStatus(
                loginStatus,
                "Enter your email and password."
            );

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "LOGGING IN...";


        try{

            await signInWithEmailAndPassword(
                auth,
                userEmail,
                userPassword
            );


            loginStatus.classList.remove(
                "show"
            );


        }catch(error){

            console.error(error);

            showStatus(
                loginStatus,
                "Login failed: " +
                error.message
            );

        }


        loginButton.disabled =
            false;

        loginButton.textContent =
            "LOGIN";

    }
);


/* LOGOUT */

logoutButton.addEventListener(
    "click",
    async function(){

        await signOut(auth);

    }
);


/* UPLOAD */

uploadButton.addEventListener(
    "click",
    uploadVideo
);


async function uploadVideo(){

    const title =
        videoTitle.value.trim();

    const file =
        videoFile.files[0];


    if(!title){

        showStatus(
            uploadStatus,
            "Enter a video title."
        );

        return;

    }


    if(!file){

        showStatus(
            uploadStatus,
            "Select a video."
        );

        return;

    }


    if(!file.type.startsWith("video/")){

        showStatus(
            uploadStatus,
            "Please select a video file."
        );

        return;

    }


    uploadButton.disabled =
        true;

    uploadButton.textContent =
        "UPLOADING...";


    progress.style.display =
        "block";

    progressBar.style.width =
        "0%";


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        "audiovisuals"
    );


    const xhr =
        new XMLHttpRequest();


    xhr.open(
        "POST",
        "https://api.cloudinary.com/v1_1/s4j0x7dk/video/upload"
    );


    xhr.upload.addEventListener(
        "progress",
        function(event){

            if(event.lengthComputable){

                const percent =
                    Math.round(
                        event.loaded /
                        event.total *
                        100
                    );

                progressBar.style.width =
                    percent + "%";

                showStatus(
                    uploadStatus,
                    "Uploading video... " +
                    percent +
                    "%"
                );

            }

        }
    );


    xhr.onload =
        async function(){

            try{

                const result =
                    JSON.parse(
                        xhr.responseText
                    );


                if(
                    xhr.status < 200 ||
                    xhr.status >= 300
                ){

                    throw new Error(
                        result.error &&
                        result.error.message
                        ?
                        result.error.message
                        :
                        "Cloudinary upload failed."
                    );

                }


                const videoUrl =
                    result.secure_url;

                const publicId =
                    result.public_id;


                const thumbnail =
                    "https://res.cloudinary.com/s4j0x7dk/video/upload/so_0/" +
                    publicId +
                    ".jpg";


                /*
                SAVE VIDEO TO FIREBASE
                */

                const newVideo =
                    push(
                        ref(
                            database,
                            "videos"
                        )
                    );


                await set(
                    newVideo,
                    {

                        title:
                            title,

                        url:
                            videoUrl,

                        publicId:
                            publicId,

                        thumbnail:
                            thumbnail,

                        published:
                            true,

                        createdAt:
                            Date.now(),

                        uploadedBy:
                            auth.currentUser.uid

                    }
                );


                showStatus(
                    uploadStatus,
                    "Video uploaded and published successfully."
                );


                videoTitle.value =
                    "";

                videoFile.value =
                    "";

                progressBar.style.width =
                    "100%";


            }catch(error){

                console.error(error);

                showStatus(
                    uploadStatus,
                    "Error: " +
                    error.message
                );

            }


            uploadButton.disabled =
                false;

            uploadButton.textContent =
                "UPLOAD & PUBLISH";

        };


    xhr.onerror =
        function(){

            showStatus(
                uploadStatus,
                "Network error while uploading."
            );


            uploadButton.disabled =
                false;

            uploadButton.textContent =
                "UPLOAD & PUBLISH";

        };


    xhr.send(
        formData
    );

}


/* LOAD VIDEOS */

function loadVideos(){

    const videosRef =
        ref(
            database,
            "videos"
        );


    onValue(
        videosRef,
        function(snapshot){

            const data =
                snapshot.val();


            videoList.innerHTML =
                "";


            if(!data){

                videoList.innerHTML =
                    "<div>No videos published yet.</div>";

                return;

            }


            const videos =
                Object.keys(data)
                .map(function(key){

                    return {
                        id:key,
                        ...data[key]
                    };

                })
                .sort(function(a,b){

                    return (
                        Number(b.createdAt || 0) -
                        Number(a.createdAt || 0)
                    );

                });


            videos.forEach(function(video){

                createVideoItem(video);

            });

        }
    );

}


/* ADMIN VIDEO ITEM */

function createVideoItem(video){

    const item =
        document.createElement("div");

    item.className =
        "video-item";


    const date =
        video.createdAt
        ?
        new Date(
            video.createdAt
        ).toLocaleString()
        :
        "";


    item.innerHTML = `

        <div class="video-thumb">

            ${
                video.thumbnail
                ?
                `<img
                    src="${escapeHtml(video.thumbnail)}"
                    alt="">`
                :
                ""
            }

        </div>

        <div class="video-details">

            <div class="video-name">

                ${escapeHtml(
                    video.title ||
                    "Untitled video"
                )}

            </div>

            <div class="video-date">

                ${escapeHtml(date)}

            </div>

        </div>

        <button
            class="delete-button">

            DELETE

        </button>

    `;


    const deleteButton =
        item.querySelector(
            ".delete-button"
        );


    deleteButton.addEventListener(
        "click",
        function(){

            deleteVideo(
                video.id,
                video.title
            );

        }
    );


    videoList.appendChild(
        item
    );

}


/* DELETE FROM FIREBASE */

async function deleteVideo(
    id,
    title
){

    if(
        !confirm(
            'Remove "' +
            title +
            '" from the public audiovisuals?'
        )
    ){

        return;

    }


    try{

        await remove(
            ref(
                database,
                "videos/" + id
            )
        );


        alert(
            "Video removed from the public catalogue."
        );


    }catch(error){

        console.error(error);

        alert(
            "Delete failed: " +
            error.message
        );

    }

}


/* ESCAPE HTML */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>

</html>
