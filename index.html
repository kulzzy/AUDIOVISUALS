<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Audiovisuals</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#06152f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

/* HEADER */

.header{
    width:100%;
    background:#071b3d;
    border-bottom:2px solid #d4af37;
    padding:18px 15px;
    text-align:center;
}

.logo{
    color:#ffd700;
    font-size:27px;
    font-weight:900;
}

.subtitle{
    margin-top:5px;
    font-size:13px;
    color:#fff;
}

/* MAIN */

.main{
    width:100%;
    max-width:1500px;
    margin:auto;
    padding:20px;
}

.title{
    color:#ffd700;
    font-size:22px;
    font-weight:900;
    margin-bottom:18px;
}

/* GRID */

.video-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.video-card{
    background:#0b234a;
    border:1px solid rgba(255,215,0,.25);
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}

.video-card:hover{
    transform:translateY(-3px);
    border-color:#ffd700;
}

.thumbnail{
    width:100%;
    aspect-ratio:16/9;
    background:#020914;
    position:relative;
    overflow:hidden;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:58px;
    height:58px;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    border:2px solid #ffd700;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ffd700;
    font-size:25px;
}

.info{
    padding:12px;
}

.video-name{
    color:#fff;
    font-size:15px;
    font-weight:800;
    line-height:1.35;
    word-break:break-word;
}

/* MESSAGE */

.message{
    width:100%;
    text-align:center;
    padding:50px 20px;
    color:#ccc;
}

.loading{
    color:#ffd700;
}

/* SHARE */

.share-area{
    text-align:center;
    margin-top:22px;
}

.share-button{
    background:#ffd700;
    color:#06152f;
    border:none;
    border-radius:8px;
    padding:12px 24px;
    font-weight:900;
    font-size:15px;
    cursor:pointer;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:99999;
    background:rgba(0,0,0,.95);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:1100px;
    position:relative;
}

.close{
    position:absolute;
    right:0;
    top:-50px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:2px solid #ffd700;
    background:#06152f;
    color:#ffd700;
    font-size:25px;
    cursor:pointer;
}

.player{
    width:100%;
    max-height:80vh;
    display:block;
    background:#000;
    border-radius:8px;
}

.modal-title{
    margin-top:10px;
    font-size:17px;
    font-weight:800;
}

/* TABLET */

@media(max-width:1100px){

    .video-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

/* PHONE */

@media(max-width:750px){

    .main{
        padding:12px;
    }

    .video-grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .logo{
        font-size:23px;
    }

    .video-name{
        font-size:13px;
    }

    .info{
        padding:9px;
    }

}

/* SMALL PHONE */

@media(max-width:430px){

    .main{
        padding:8px;
    }

    .video-grid{
        grid-template-columns:repeat(2,1fr);
        gap:8px;
    }

    .video-name{
        font-size:12px;
    }

    .play{
        width:45px;
        height:45px;
        font-size:19px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="logo">
        KULZZY RADIO
    </div>

    <div class="subtitle">
        AUDIOVISUALS
    </div>

</header>


<main class="main">

    <div class="title">
        LATEST AUDIOVISUALS
    </div>

    <div
        id="videoGrid"
        class="video-grid">

        <div class="message loading">
            Loading videos...
        </div>

    </div>


    <div class="share-area">

        <button
            class="share-button"
            id="shareButton">

            SHARE

        </button>

    </div>

</main>


<!-- VIDEO PLAYER -->

<div
    id="videoModal"
    class="modal">

    <div class="modal-content">

        <button
            id="closeButton"
            class="close">

            ×

        </button>

        <video
            id="mainVideo"
            class="player"
            controls
            playsinline
            preload="metadata">
        </video>

        <div
            id="modalTitle"
            class="modal-title">
        </div>

    </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyCheGUZWbyh3IS4l_MbToCyBgYDre8ZU_M",

    authDomain:
    "audiovisuals-500cf.firebaseapp.com",

    databaseURL:
    "https://audiovisuals-500cf-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "audiovisuals-500cf",

    storageBucket:
    "audiovisuals-500cf.firebasestorage.app",

    messagingSenderId:
    "34375747661",

    appId:
    "1:34375747661:web:94ec087328dc5daebd3404",

    measurementId:
    "G-HE48JBFLD6"

};


/* INITIALIZE FIREBASE */

const app =
    initializeApp(firebaseConfig);

const database =
    getDatabase(app);


/* ELEMENTS */

const videoGrid =
    document.getElementById("videoGrid");

const videoModal =
    document.getElementById("videoModal");

const mainVideo =
    document.getElementById("mainVideo");

const modalTitle =
    document.getElementById("modalTitle");

const closeButton =
    document.getElementById("closeButton");

const shareButton =
    document.getElementById("shareButton");


/* LOAD VIDEOS */

const videosRef =
    ref(database,"videos");


onValue(
    videosRef,
    function(snapshot){

        const data =
            snapshot.val();

        videoGrid.innerHTML = "";

        if(!data){

            videoGrid.innerHTML = `
                <div class="message">
                    No audiovisuals published yet.
                </div>
            `;

            return;

        }


        const videos =
            Object.keys(data)
            .map(function(key){

                return {
                    id:key,
                    ...data[key]
                };

            })
            .filter(function(video){

                return video.published !== false;

            })
            .sort(function(a,b){

                return (
                    Number(b.createdAt || 0) -
                    Number(a.createdAt || 0)
                );

            });


        if(videos.length === 0){

            videoGrid.innerHTML = `
                <div class="message">
                    No audiovisuals published yet.
                </div>
            `;

            return;

        }


        videos.forEach(function(video){

            createCard(video);

        });

    },
    function(error){

        console.error(error);

        videoGrid.innerHTML = `
            <div class="message">
                Unable to load audiovisuals.
            </div>
        `;

    }
);


/* CREATE VIDEO CARD */

function createCard(video){

    const card =
        document.createElement("div");

    card.className =
        "video-card";


    let thumbnail =
        video.thumbnail || "";


    card.innerHTML = `

        <div class="thumbnail">

            ${
                thumbnail
                ?
                `<img
                    src="${escapeHtml(thumbnail)}"
                    alt="${escapeHtml(video.title || "Video")}"
                    loading="lazy">`
                :
                ""
            }

            <div class="play">
                ▶
            </div>

        </div>

        <div class="info">

            <div class="video-name">

                ${escapeHtml(
                    video.title ||
                    "Kulzzy Radio Audiovisual"
                )}

            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        function(){

            openVideo(video);

        }
    );


    videoGrid.appendChild(card);

}


/* OPEN VIDEO */

function openVideo(video){

    if(!video.url){
        return;
    }


    /*
    PAUSE KULZZY RADIO
    */

    window.parent.postMessage({

        source:
        "KULZZY_AUDIOVISUALS",

        action:
        "VIDEO_PLAY"

    },"*");


    mainVideo.src =
        video.url;

    modalTitle.textContent =
        video.title ||
        "Kulzzy Radio Audiovisual";


    videoModal.classList.add(
        "active"
    );


    mainVideo.play().catch(function(){

    });

}


/* VIDEO FINISHED */

mainVideo.addEventListener(
    "ended",
    function(){

        resumeRadio();

    }
);


/* CLOSE VIDEO */

function closeVideo(){

    mainVideo.pause();

    mainVideo.removeAttribute(
        "src"
    );

    mainVideo.load();

    videoModal.classList.remove(
        "active"
    );


    resumeRadio();

}


/* CLOSE BUTTON */

closeButton.addEventListener(
    "click",
    closeVideo
);


/* RESUME RADIO */

function resumeRadio(){

    window.parent.postMessage({

        source:
        "KULZZY_AUDIOVISUALS",

        action:
        "VIDEO_ENDED"

    },"*");

}


/* CLICK OUTSIDE */

videoModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            videoModal
        ){

            closeVideo();

        }

    }
);


/* ESCAPE */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            videoModal.classList.contains("active")
        ){

            closeVideo();

        }

    }
);


/* SHARE */

shareButton.addEventListener(
    "click",
    async function(){

        const shareData = {

            title:
            "Kulzzy Radio Audiovisuals",

            text:
            "Watch Kulzzy Radio Audiovisuals",

            url:
            window.location.href

        };


        if(
            navigator.share
        ){

            try{

                await navigator.share(
                    shareData
                );

            }catch(error){

            }

        }else{

            try{

                await navigator.clipboard.writeText(
                    window.location.href
                );

                alert(
                    "Audiovisuals link copied."
                );

            }catch(error){

                alert(
                    window.location.href
                );

            }

        }

    }
);


/* ESCAPE HTML */

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
