<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Kulzzy Radio Audiovisuals</title>

<meta name="description"
      content="Kulzzy Radio Audiovisuals">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#06152f;
    color:white;
}

body{
    overflow-x:hidden;
}

/* =====================================================
   HEADER
===================================================== */

.header{
    width:100%;
    background:#071b3d;
    border-bottom:2px solid #d4af37;
    padding:18px 20px;
    text-align:center;
}

.logo-title{
    font-size:28px;
    font-weight:900;
    color:#ffd700;
    letter-spacing:1px;
}

.logo-subtitle{
    margin-top:5px;
    font-size:13px;
    color:#ffffff;
    opacity:.85;
}

/* =====================================================
   MAIN
===================================================== */

.main{
    width:100%;
    max-width:1500px;
    margin:auto;
    padding:20px;
}

.section-title{
    font-size:22px;
    font-weight:900;
    margin-bottom:18px;
    color:#ffd700;
}

/* =====================================================
   VIDEO GRID
===================================================== */

.video-grid{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.video-card{
    background:#0c2349;
    border:1px solid rgba(255,215,0,.25);
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s ease;
}

.video-card:hover{
    transform:translateY(-3px);
    border-color:#ffd700;
}

.video-thumbnail{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#020b19;
    overflow:hidden;
}

.video-thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.play-button{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:58px;
    height:58px;
    border-radius:50%;
    background:rgba(0,0,0,.75);
    border:2px solid #ffd700;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    color:#ffd700;
}

.video-info{
    padding:12px;
}

.video-title{
    font-size:15px;
    font-weight:800;
    line-height:1.35;
    color:white;
    word-break:break-word;
}

/* =====================================================
   SHARE
===================================================== */

.share-area{
    margin-top:20px;
    display:flex;
    justify-content:center;
}

.share-button{
    border:none;
    background:#ffd700;
    color:#06152f;
    font-size:15px;
    font-weight:900;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
}

.share-button:active{
    transform:scale(.97);
}

/* =====================================================
   EMPTY / LOADING
===================================================== */

.message{
    width:100%;
    text-align:center;
    padding:50px 20px;
    color:#ccc;
    font-size:16px;
}

.loading{
    color:#ffd700;
}

/* =====================================================
   VIDEO MODAL
===================================================== */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.94);
    z-index:99999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:1100px;
    position:relative;
}

.close-button{
    position:absolute;
    right:0;
    top:-50px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:2px solid #ffd700;
    background:#06152f;
    color:#ffd700;
    font-size:25px;
    cursor:pointer;
    z-index:5;
}

.video-player{
    width:100%;
    max-height:80vh;
    background:#000;
    display:block;
    border-radius:8px;
}

.modal-title{
    margin-top:12px;
    color:white;
    font-size:17px;
    font-weight:800;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1100px){

    .video-grid{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:750px){

    .main{
        padding:14px;
    }

    .video-grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .logo-title{
        font-size:23px;
    }

    .video-info{
        padding:9px;
    }

    .video-title{
        font-size:13px;
    }

}

@media(max-width:430px){

    .video-grid{
        grid-template-columns:1fr 1fr;
        gap:8px;
    }

    .main{
        padding:8px;
    }

    .video-title{
        font-size:12px;
    }

    .play-button{
        width:46px;
        height:46px;
        font-size:20px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="logo-title">
        KULZZY RADIO
    </div>

    <div class="logo-subtitle">
        AUDIOVISUALS
    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

    <div class="section-title">
        LATEST AUDIOVISUALS
    </div>

    <div id="videoGrid"
         class="video-grid">

        <div class="message loading">
            Loading videos...
        </div>

    </div>


    <div class="share-area">

        <button
            class="share-button"
            onclick="sharePage()">

            SHARE

        </button>

    </div>

</main>


<!-- =====================================================
     VIDEO MODAL
===================================================== -->

<div id="videoModal"
     class="modal">

    <div class="modal-content">

        <button
            class="close-button"
            onclick="closeVideo()">

            ×

        </button>

        <video
            id="mainVideo"
            class="video-player"
            controls
            playsinline
            preload="metadata">
        </video>

        <div
            id="modalTitle"
            class="modal-title">
        </div>

    </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

import {
    firebaseConfig
} from "./firebase-config-module.js";

</script>


<script type="module">

/*
==========================================================
FIREBASE CONFIG
==========================================================
*/

const firebaseConfig = {

    apiKey:
    "AIzaSyCheGUZWbyh3IS4l_MbToCyBgYDre8ZU_M",

    authDomain:
    "audiovisuals-500cf.firebaseapp.com",

    databaseURL:
    "https://audiovisuals-500cf-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
    "audiovisuals-500cf",

    storageBucket:
    "audiovisuals-500cf.firebasestorage.app",

    messagingSenderId:
    "34375747661",

    appId:
    "1:34375747661:web:94ec087328dc5daebd3404",

    measurementId:
    "G-HE48JBFLD6"
};


/*
==========================================================
FIREBASE INITIALIZE
==========================================================
*/

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const app =
    initializeApp(firebaseConfig);

const database =
    getDatabase(app);


/*
==========================================================
VIDEO LIST
==========================================================
*/

const videoGrid =
    document.getElementById("videoGrid");

const videoModal =
    document.getElementById("videoModal");

const mainVideo =
    document.getElementById("mainVideo");

const modalTitle =
    document.getElementById("modalTitle");


let videos = [];


/*
==========================================================
CREATE THUMBNAIL
==========================================================
*/

function getThumbnail(video){

    if(video.thumbnail){
        return video.thumbnail;
    }

    if(video.publicId){

        return (
            "https://res.cloudinary.com/s4j0x7dk/video/upload/" +
            "so_0/" +
            video.publicId +
            ".jpg"
        );

    }

    return "";

}


/*
==========================================================
LOAD VIDEOS FROM FIREBASE
==========================================================
*/

const videosRef =
    ref(database,"videos");


onValue(
    videosRef,
    function(snapshot){

        const data =
            snapshot.val();

        videos = [];

        if(data){

            Object.keys(data).forEach(function(key){

                const video =
                    data[key];

                if(video && video.published !== false){

                    video.id = key;

                    videos.push(video);

                }

            });

        }


        /*
        NEWEST FIRST
        */

        videos.sort(function(a,b){

            return (
                Number(b.createdAt || 0) -
                Number(a.createdAt || 0)
            );

        });


        renderVideos();

    },
    function(error){

        console.error(error);

        videoGrid.innerHTML = `
            <div class="message">
                Unable to load videos.
            </div>
        `;

    }
);


/*
==========================================================
RENDER VIDEOS
==========================================================
*/

function renderVideos(){

    videoGrid.innerHTML = "";


    if(videos.length === 0){

        videoGrid.innerHTML = `
            <div class="message">
                No audiovisuals published yet.
            </div>
        `;

        return;

    }


    videos.forEach(function(video){

        const card =
            document.createElement("div");

        card.className =
            "video-card";


        const thumbnail =
            getThumbnail(video);


        card.innerHTML = `

            <div class="video-thumbnail">

                ${
                    thumbnail
                    ?
                    `<img
                        src="${escapeHtml(thumbnail)}"
                        alt="${escapeHtml(video.title || "Video")}"
                        loading="lazy">`
                    :
                    ""
                }

                <div class="play-button">
                    ▶
                </div>

            </div>

            <div class="video-info">

                <div class="video-title">

                    ${escapeHtml(
                        video.title ||
                        "Kulzzy Radio Audiovisual"
                    )}

                </div>

            </div>

        `;


        card.addEventListener(
            "click",
            function(){

                openVideo(video);

            }
        );


        videoGrid.appendChild(card);

    });

}


/*
==========================================================
OPEN VIDEO
==========================================================
*/

function openVideo(video){

    if(!video.url){
        return;
    }


    /*
    Tell parent Kulzzy Radio page
    to pause the live audio.
    */

    window.parent.postMessage({

        source:
        "KULZZY_AUDIOVISUALS",

        action:
        "VIDEO_PLAY"

    },"*");


    mainVideo.src =
        video.url;

    modalTitle.textContent =
        video.title ||
        "Kulzzy Radio Audiovisual";


    videoModal.classList.add(
        "active"
    );


    mainVideo.play().catch(function(error){

        console.log(
            "Autoplay requires user interaction:",
            error
        );

    });

}


/*
==========================================================
VIDEO ENDED
==========================================================
*/

mainVideo.addEventListener(
    "ended",
    function(){

        resumeRadio();

    }
);


/*
==========================================================
CLOSE VIDEO
==========================================================
*/

window.closeVideo =
function(){

    mainVideo.pause();

    mainVideo.removeAttribute(
        "src"
    );

    mainVideo.load();

    videoModal.classList.remove(
        "active"
    );


    resumeRadio();

};


/*
==========================================================
RESUME RADIO
==========================================================
*/

function resumeRadio(){

    window.parent.postMessage({

        source:
        "KULZZY_AUDIOVISUALS",

        action:
        "VIDEO_ENDED"

    },"*");

}


/*
==========================================================
CLICK OUTSIDE MODAL
==========================================================
*/

videoModal.addEventListener(
    "click",
    function(event){

        if(
            event.target ===
            videoModal
        ){

            closeVideo();

        }

    }
);


/*
==========================================================
ESCAPE KEY
==========================================================
*/

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" &&
            videoModal.classList.contains("active")
        ){

            closeVideo();

        }

    }
);


/*
==========================================================
SHARE PAGE
==========================================================
*/

window.sharePage =
function(){

    const shareData = {

        title:
        "Kulzzy Radio Audiovisuals",

        text:
        "Watch Kulzzy Radio Audiovisuals",

        url:
        window.location.href

    };


    if(
        navigator.share
    ){

        navigator.share(
            shareData
        ).catch(function(){

        });

    }else{

        navigator.clipboard.writeText(
            window.location.href
        ).then(function(){

            alert(
                "Audiovisuals link copied."
            );

        }).catch(function(){

            alert(
                window.location.href
            );

        });

    }

};


/*
==========================================================
HTML ESCAPE
==========================================================
*/

function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
